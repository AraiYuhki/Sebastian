# sebastian-ci 自身をビルドするサンプルパイプライン（ドッグフーディング用）
name: sebastian-ci-self-build
jobs:
  restore:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    commands:
      - dotnet restore src/SebastianCi/SebastianCi.csproj

  build:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    needs: [restore]
    commands:
      - dotnet build src/SebastianCi/SebastianCi.csproj --configuration Release --no-restore

  inspect:
    # restore と依存関係がないため build 系と並列に実行される
    image: alpine:3.20
    commands:
      - echo "ソースファイル一覧:"
      - find src -name '*.cs' | sort

  publish:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    needs: [build, inspect]
    commands:
      - dotnet publish src/SebastianCi/SebastianCi.csproj --configuration Release --output artifacts
